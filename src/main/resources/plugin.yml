name: TCPack
version: '${project.version}'
main: me.tzahi.TCPack.TCPack
api-version: '1.13'
authors: [Tzahi, TacoID, Trenly]
website: https://github.com/Trenly/TCPack
description: Personal time, flight, and compression; original by tzahi12345 and TacoID, refactor by Trenly.
commands:
  tcpack:
    description: List TCPack command families.
    usage: /<command>
  ptime:
    description: Set or inspect your personal time.
    usage: /<command> [day|night|morning|dawn|dusk|reset|info]
  fly:
    description: Control flight in survival or adventure mode.
    usage: /<command> [t|toggle|on|off] [player]
  compress:
    description: Compress plain inventory items into logs or storage blocks.
    usage: /<command> [wood|bonemeal|ores]
permissions:
  tcpack.list:
    description: View TCPack help.
    default: op
  compress.list:
    description: View compression help.
    default: op
  compress.wood:
    description: Convert planks to base logs or stems.
    default: op
  compress.bonemeal:
    description: Convert bonemeal to bone blocks or bones.
    default: op
  compress.ores:
    description: Convert iron/gold nuggets into ingots and ingots, raw ores, diamonds, redstone, and lapis into blocks.
    default: op
  ptime.list:
    description: View personal time help.
    default: op
  ptime.day:
    description: Set personal time to day.
    default: op
  ptime.night:
    description: Set personal time to night.
    default: op
  ptime.morning:
    description: Set personal time to morning.
    default: op
  ptime.dawn:
    description: Set personal time to sunrise.
    default: op
  ptime.dusk:
    description: Set personal time to sunset.
    default: op
  ptime.reset:
    description: Reset personal time to server time.
    default: op
  ptime.info:
    description: Inspect personal time and offset.
    default: op
  fly.list:
    description: View flight help.
    default: op
  fly.toggle:
    description: Toggle your own flight.
    default: op
  fly.enable:
    description: Enable your own flight.
    default: op
  fly.disable:
    description: Disable your own flight.
    default: op
  fly.toggle.other:
    description: Toggle another online player's flight.
    default: op
  fly.enable.other:
    description: Enable another online player's flight.
    default: op
  fly.disable.other:
    description: Disable another online player's flight.
    default: op
